version: '3.8'

services:
  # PostgreSQL Database with PGVector extension
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: arketic_database_dev
    environment:
      POSTGRES_DB: arketic_db_dev
      POSTGRES_USER: arketic_user
      POSTGRES_PASSWORD: arketic_password_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arketic_network_dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arketic_user -d arketic_db_dev"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backend API Service (Development Mode)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: build-deps  # Use development stage with dev dependencies
    container_name: arketic_backend_dev
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://arketic_user:arketic_password_dev@database:5432/arketic_db_dev
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: arketic_user
      POSTGRES_PASSWORD: arketic_password_dev
      POSTGRES_DB: arketic_db_dev
      JWT_SECRET: ${JWT_SECRET:-arketic-dev-secret-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
    networks:
      - arketic_network_dev
    restart: unless-stopped
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Frontend Application (Development Mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps  # Use development stage
    container_name: arketic_frontend_dev
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arketic_network_dev
    restart: unless-stopped
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_dev_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  arketic_network_dev:
    driver: bridge