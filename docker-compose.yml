version: '3.8'

services:
  # PostgreSQL Database with PGVector extension
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: arketic_database
    environment:
      POSTGRES_DB: arketic_db
      POSTGRES_USER: arketic_user
      POSTGRES_PASSWORD: arketic_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - arketic_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arketic_user -d arketic_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arketic_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://arketic_user:arketic_password@database:5432/arketic_db
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: arketic_user
      POSTGRES_PASSWORD: arketic_password
      POSTGRES_DB: arketic_db
      JWT_SECRET: ${JWT_SECRET:-arketic-super-secret-jwt-key-2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - arketic_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arketic_frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arketic_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local

networks:
  arketic_network:
    driver: bridge